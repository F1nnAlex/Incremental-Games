<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wyrmheart</title>
  <meta name="description" content="An incremental game: find an egg in the forest, feed it, and raise a dragon that grows and travels further with every Molt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Wyrmheart</div>
    <div class="top-stats">
      <div class="top-stat">
        <span class="top-label">Food</span>
        <span id="headerFood" class="top-value">0</span>
        <span id="headerRate" class="top-rate"></span>
      </div>
      <div id="headerScalesBox" class="top-stat" hidden>
        <span class="top-label">Scales</span>
        <span id="headerScales" class="top-value gold">0</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section id="stage" class="stage" aria-label="Your dragon"></section>
    <section class="panel">
      <nav id="tabBar" class="tab-bar" role="tablist"></nav>
      <div id="tabContainer" class="tab-container"></div>
    </section>
  </main>

  <div id="notifications" class="notifications" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <!-- Big numbers -->
  <script src="lib/break_eternity.js"></script>

  <!-- Engine (copied from Speck) -->
  <script src="js/core/decimal.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/scaling.js"></script>
  <script src="js/core/layers.js"></script>
  <script src="js/core/automation.js"></script>
  <script src="js/core/player.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/tabs.js"></script>
  <script src="js/core/hotkeys.js"></script>
  <script src="js/core/loop.js"></script>

  <!-- Content, in layer order -->
  <script src="js/content/forage.js"></script>
  <script src="js/content/youngling.js"></script>
  <script src="js/content/achievements.js"></script>

  <!-- Stage -->
  <script src="js/art/stage.js"></script>

  <script src="js/game.js"></script>
</body>
</html>
