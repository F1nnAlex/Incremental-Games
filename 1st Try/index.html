<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Titillium+Web:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header">
    <div id="headerForm" class="header-form"></div>
    <div class="header-main">
      <div id="headerAmount" class="header-amount"></div>
      <div id="headerRate" class="header-rate"></div>
    </div>
    <div id="headerEvolve" class="header-evolve"></div>
    <div id="headerResets" class="header-resets"></div>
  </header>
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="layout">
    <nav id="tabBar" aria-label="Game tabs"></nav>
    <main id="tabContainer"></main>
    <aside id="resources" aria-label="Resources"></aside>
  </div>

  <div id="modalRoot"></div>
  <div id="notifications"></div>

  <!-- Library -->
  <script src="lib/break_eternity.js"></script>

  <!-- Engine (order matters) -->
  <script src="js/core/decimal.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/scaling.js"></script>
  <script src="js/core/layers.js"></script>
  <script src="js/core/automation.js"></script>
  <script src="js/core/systems.js"></script>
  <script src="js/core/player.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/tabs.js"></script>
  <script src="js/core/hotkeys.js"></script>
  <script src="js/core/loop.js"></script>

  <!-- Game content: one file per layer, in layer order -->
  <script src="js/content/units.js"></script>
  <script src="js/content/accretion.js"></script>
  <script src="js/content/evolution.js"></script>
  <script src="js/content/collision.js"></script>
  <script src="js/content/atmosphere.js"></script>
  <script src="js/content/interior.js"></script>
  <script src="js/content/fusion.js"></script>
  <script src="js/content/starmap.js"></script>
  <script src="js/content/system.js"></script>
  <script src="js/content/nursery.js"></script>
  <script src="js/content/supernova.js"></script>
  <script src="js/content/tree.js"></script>
  <script src="js/content/anomalies.js"></script>
  <script src="js/content/kilonova.js"></script>
  <script src="js/content/refine.js"></script>
  <script src="js/content/galaxy.js"></script>
  <script src="js/content/spectrum.js"></script>
  <script src="js/content/achievements.js"></script>
  <script src="js/content/art.js"></script>
  <script src="js/content/sky.js"></script>

  <!-- Start -->
  <script src="js/game.js"></script>
</body>
</html>
